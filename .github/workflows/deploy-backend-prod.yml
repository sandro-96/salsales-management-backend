# Deploy production backend JAR → S3 → EC2 systemd (api.sotuci.vn)
# Setup: ../salsales-management-web/docs/deploy/GITHUB-CICD-SETUP.md

name: Deploy backend (prod)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - '.github/workflows/deploy-backend-prod.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  S3_DEPLOY_BUCKET: salsales-deploy-prod
  S3_JAR_KEY: backend/sales-latest.jar
  EC2_INSTANCE_ID: i-08167ad5505b5b164

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: chmod +x mvnw && ./mvnw -B package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload JAR to S3
        run: |
          JAR=$(ls target/sales-*.jar | head -1)
          echo "Uploading $JAR"
          aws s3 cp "$JAR" "s3://${S3_DEPLOY_BUCKET}/${S3_JAR_KEY}"
          aws s3 cp "$JAR" "s3://${S3_DEPLOY_BUCKET}/backend/sales-${{ github.sha }}.jar"

      - name: Deploy on EC2 via SSM
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          if [ -z "$INSTANCE_ID" ]; then
            INSTANCE_ID="${{ env.EC2_INSTANCE_ID }}"
          fi
          SSM_COMMANDS=$(jq -nc \
            --arg bucket "$S3_DEPLOY_BUCKET" \
            --arg key "$S3_JAR_KEY" \
            --arg region "$AWS_REGION" \
            '{commands: [
              "set -e",
              ("aws s3 cp s3://" + $bucket + "/" + $key + " /tmp/app.jar --region " + $region),
              "sudo mv /tmp/app.jar /opt/salsales/app.jar",
              "sudo chown ec2-user:ec2-user /opt/salsales/app.jar",
              "bash /opt/salsales/load-env.sh",
              "sudo systemctl restart salsales",
              "sleep 8",
              "curl -sf http://127.0.0.1:8080/actuator/health | grep -q UP"
            ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend ${{ github.sha }}" \
            --parameters "$SSM_COMMANDS" \
            --query Command.CommandId --output text)
          echo "SSM CommandId: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          echo "SSM status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi
