# Profile: staging (Railway / Render — free tier)
# Run: --spring.profiles.active=staging

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:salesdb-test}

app.jwt.secret=${APP_JWT_SECRET}
app.fe.url=${FRONTEND_URL}
# Vercel + local dev (comma-separated, no spaces)
app.fe.cors-origins=${FRONTEND_CORS_ORIGINS:}

app.frontend.verify-url=${FRONTEND_VERIFY_URL:${FRONTEND_URL}/verify}

spring.cache.type=simple
webhook.secret=${WEBHOOK_SECRET}

# Mail — optional on staging
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# AWS S3 — optional; leave empty to skip real uploads or use staging bucket
aws.s3.access-key=${AWS_ACCESS_KEY:}
aws.s3.secret-key=${AWS_SECRET_KEY:}
aws.s3.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${AWS_S3_BUCKET:}

app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

app.payment.vnpay.return-url=${VNPAY_RETURN_URL:${FRONTEND_URL}/billing}
app.payment.momo.redirect-url=${MOMO_REDIRECT_URL:${FRONTEND_URL}/billing}
app.payment.momo.ipn-url=${MOMO_IPN_URL:}

logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
