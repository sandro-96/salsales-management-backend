# Railway — free tier staging API
# Docs: https://docs.railway.app/reference/config-as-code

[build]
# Dockerfile riêng — không dùng Nixpacks (tránh bake secrets vào ARG/ENV lúc build).
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Profile staging; biến nhạy cảm (VNPAY_HASH_SECRET, MAIL_PASSWORD, …) chỉ cần trong Railway Variables lúc chạy.
startCommand = "java -XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -jar /app/app.jar --spring.profiles.active=staging"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
