# Railway — free tier staging API
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
# mvnw may lack +x on Windows clones; bash works without execute bit
buildCommand = "chmod +x mvnw && ./mvnw -DskipTests package"

[deploy]
# Free tier ~512MB: cap heap so JVM + metaspace không OOM kill container
startCommand = "java -XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -jar target/sales-0.0.1-SNAPSHOT.jar --spring.profiles.active=staging"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
